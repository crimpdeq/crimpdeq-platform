name: Release Crimpdeq Platform

on:
    release:
        types: [created]
    # Dry run: build and check the release files without publishing them.
    workflow_dispatch:

permissions:
    contents: read

jobs:
    parts:
        name: Build platform release files
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install OpenSCAD
              uses: ./.github/actions/setup-openscad

            - name: Build STL files
              run: EXPORT_DIR=artifacts bash export-parts.sh

            - name: Check STL files
              run: |
                  for part in base_front base_rear anchor grip keepers keys rest stoppers; do
                      test -f "artifacts/crimpdeq-platform-${part}.stl"
                  done
                  python3 check-stl-components.py \
                      artifacts/crimpdeq-platform-{base_front,base_rear,anchor,grip,rest}.stl
                  python3 check-stl-components.py --expect 2 \
                      artifacts/crimpdeq-platform-{keepers,keys,stoppers}.stl

            - name: Install Bambu Studio
              uses: ./.github/actions/setup-bambu-studio

            - name: Build Bambu Studio project
              run: python3 export-bambu-project.py --output artifacts/crimpdeq-platform.3mf

            - name: Upload platform release files
              uses: actions/upload-artifact@v6
              with:
                  name: release-platform-files
                  path: |
                      artifacts/*.stl
                      artifacts/*.3mf
                  if-no-files-found: error
                  compression-level: 0

    publish:
        name: Upload files to GitHub release
        if: github.event_name == 'release'
        runs-on: ubuntu-latest
        needs:
            - parts
        permissions:
            contents: write

        steps:
            - name: Download platform release files
              uses: actions/download-artifact@v6
              with:
                  name: release-platform-files
                  path: release-assets/platform

            - name: Verify release assets exist
              run: |
                  for part in base_front base_rear anchor grip keepers keys rest stoppers; do
                      test -f "release-assets/platform/crimpdeq-platform-${part}.stl"
                  done
                  test -f release-assets/platform/crimpdeq-platform.3mf

            - name: Upload release assets
              uses: svenstaro/upload-release-action@v2
              with:
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  tag: ${{ github.ref }}
                  file: release-assets/*/*
                  file_glob: true
                  overwrite: true
