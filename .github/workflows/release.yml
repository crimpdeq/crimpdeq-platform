name: Release Crimpdeq Platform

on:
    release:
        types: [created]
    # Dry run: build and check the release files without publishing them.
    workflow_dispatch:

permissions:
    contents: read

jobs:
    parts:
        name: Build platform release files
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install OpenSCAD
              uses: ./.github/actions/setup-openscad

            - name: Build STL files
              run: EXPORT_DIR=artifacts bash export-parts.sh

            - name: Check STL files
              run: |
                  for part in frame_left frame_right grip wrist_rest stoppers; do
                      test -f "artifacts/crimpdeq-platform-${part}.stl"
                  done
                  python3 check-stl-components.py \
                      artifacts/crimpdeq-platform-{frame_left,frame_right,grip,wrist_rest}.stl
                  python3 check-stl-components.py --expect 2 \
                      artifacts/crimpdeq-platform-stoppers.stl

            - name: Build on-plate STL files
              run: ON_PLATE=true EXPORT_DIR=plate-stl bash export-parts.sh

            - name: Upload platform release files
              uses: actions/upload-artifact@v6
              with:
                  name: release-platform-files
                  path: artifacts/*.stl
                  if-no-files-found: error
                  compression-level: 0

            - name: Upload on-plate STL files
              uses: actions/upload-artifact@v6
              with:
                  name: plate-stl
                  path: plate-stl/*.stl
                  if-no-files-found: error

    bambu-project:
        name: Build Bambu Studio project
        # The Linux Bambu Studio can't render plate thumbnails headless, and
        # the Apple silicon runners have no accelerated OpenGL for them.
        runs-on: macos-15-intel
        needs:
            - parts

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Download on-plate STL files
              uses: actions/download-artifact@v6
              with:
                  name: plate-stl
                  path: plate-stl

            - name: Install Bambu Studio
              uses: ./.github/actions/setup-bambu-studio

            - name: Build Bambu Studio project
              run: >
                  python3 export-bambu-project.py --stl-dir plate-stl
                  --output artifacts/crimpdeq-platform.3mf

            - name: Upload Bambu Studio project
              uses: actions/upload-artifact@v6
              with:
                  name: release-bambu-project
                  path: artifacts/crimpdeq-platform.3mf
                  if-no-files-found: error
                  compression-level: 0

    publish:
        name: Upload files to GitHub release
        if: github.event_name == 'release'
        runs-on: ubuntu-latest
        needs:
            - parts
            - bambu-project
        permissions:
            contents: write

        steps:
            - name: Download platform release files
              uses: actions/download-artifact@v6
              with:
                  name: release-platform-files
                  path: release-assets/platform

            - name: Download Bambu Studio project
              uses: actions/download-artifact@v6
              with:
                  name: release-bambu-project
                  path: release-assets/bambu

            - name: Verify release assets exist
              run: |
                  for part in frame_left frame_right grip wrist_rest stoppers; do
                      test -f "release-assets/platform/crimpdeq-platform-${part}.stl"
                  done
                  test -f release-assets/bambu/crimpdeq-platform.3mf

            - name: Upload release assets
              uses: svenstaro/upload-release-action@v2
              with:
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  tag: ${{ github.ref }}
                  file: release-assets/*/*
                  file_glob: true
                  overwrite: true
