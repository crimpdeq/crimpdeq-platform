name: Set up OpenSCAD
description: >
    Install the pinned OpenSCAD development snapshot as `openscad`. Its
    Manifold backend is far faster than the CGAL-only 2021.01 release.

inputs:
    version:
        description: Snapshot version on files.openscad.org/snapshots
        default: "2026.09.23"

runs:
    using: composite
    steps:
        - name: Cache the AppImage
          uses: actions/cache@v6
          with:
              path: ${{ runner.temp }}/openscad-appimage
              key: openscad-${{ inputs.version }}-x86_64

        - name: Install OpenSCAD
          shell: bash
          env:
              OPENSCAD_VERSION: ${{ inputs.version }}
              APPIMAGE_DIR: ${{ runner.temp }}/openscad-appimage
          run: |
              set -euo pipefail
              appimage="$APPIMAGE_DIR/OpenSCAD-${OPENSCAD_VERSION}-x86_64.AppImage"
              if [[ ! -f "$appimage" ]]; then
                  mkdir -p "$APPIMAGE_DIR"
                  curl -fsSL --retry 3 -o "$appimage" \
                      "https://files.openscad.org/snapshots/OpenSCAD-${OPENSCAD_VERSION}-x86_64.AppImage"
              fi
              chmod +x "$appimage"
              # Extract instead of mounting: the runner has no FUSE 2.
              cd "$RUNNER_TEMP"
              "$appimage" --appimage-extract >/dev/null
              sudo ln -sf "$RUNNER_TEMP/squashfs-root/AppRun" /usr/local/bin/openscad
              openscad --version
