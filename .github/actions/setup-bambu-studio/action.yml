name: Set up Bambu Studio
description: >
    Install the pinned Bambu Studio macOS application and point BAMBU_STUDIO
    at its executable, for building the release project file. It runs on
    macOS because the Linux AppImage can't render plate thumbnails headless.

inputs:
    version:
        description: Bambu Studio release tag on github.com/bambulab/BambuStudio
        default: v02.08.02.61
    asset:
        description: macOS disk image asset of that release
        default: Bambu_Studio_mac-v02.08.02.61-20260820225108.dmg
    sha256:
        description: SHA-256 of the disk image
        default: cf648a95858fb630e1353c4987038df60d6caab693f18411fb95fb809f2d6926

runs:
    using: composite
    steps:
        - name: Cache the disk image
          uses: actions/cache@v6
          with:
              path: ${{ runner.temp }}/bambu-studio-dmg
              key: bambu-studio-${{ inputs.asset }}

        - name: Install Bambu Studio
          shell: bash
          env:
              BAMBU_VERSION: ${{ inputs.version }}
              BAMBU_ASSET: ${{ inputs.asset }}
              BAMBU_SHA256: ${{ inputs.sha256 }}
              DMG_DIR: ${{ runner.temp }}/bambu-studio-dmg
          run: |
              set -euo pipefail
              dmg="$DMG_DIR/$BAMBU_ASSET"
              if [[ ! -f "$dmg" ]]; then
                  mkdir -p "$DMG_DIR"
                  curl -fsSL --retry 3 -o "$dmg" \
                      "https://github.com/bambulab/BambuStudio/releases/download/${BAMBU_VERSION}/${BAMBU_ASSET}"
              fi
              echo "$BAMBU_SHA256  $dmg" | shasum -a 256 -c -

              mount="$RUNNER_TEMP/bambu-studio-mount"
              hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg" >/dev/null
              app="$RUNNER_TEMP/BambuStudio.app"
              cp -R "$mount/BambuStudio.app" "$app"
              hdiutil detach "$mount" >/dev/null

              exe="$app/Contents/MacOS/BambuStudio"
              test -x "$exe"
              test -d "$app/Contents/Resources/profiles/BBL"
              echo "BAMBU_STUDIO=$exe" >>"$GITHUB_ENV"
              # The CLI writes result.json into the working directory.
              (cd "$RUNNER_TEMP" && "$exe" --help >/dev/null)
